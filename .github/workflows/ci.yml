name: CI

on:
  # The repository has a single branch, `feat/gymtracker-mvp`, and it is the default one.
  # The workflow used to listen to `main` only, a branch that does not exist here: every push
  # produced a `startup_failure` run and the pipeline never ran once.
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Never install git hooks on a build machine.
          HUSKY: 0

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      # The suite runs against a real stack and not a mock, because its subject is a browser
      # going offline and coming back: the queue that survives that is the store, the persister
      # and TanStack's pause and resume working together, and none of it is observable against
      # a stub. It is the local stack rather than the hosted project on purpose -- a test run
      # must never write its workouts into real data (decision in `L24`).
      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned instead of `latest`: the pipeline's database suite depends on the
          # Postgres major version this version ships, and a new release should be a
          # deliberate change, not something a push discovers.
          version: 2.120.0

      - name: Start the local stack
        run: supabase start

      # The RLS/pgTAP suite is the only test of the security boundary the architecture
      # relies on: that A cannot read B's rows and that `anon` has no table privileges.
      # Leaving it out of CI meant it ran only when somebody remembered the manual command,
      # against the hosted project — which is not where a schema is tested.
      - name: Database suite (RLS and RPCs)
        run: supabase test db

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end suite
        run: npm run e2e

      - name: Keep the report if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
