<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GymTracker</title>
    <meta name="description" content="Registrá tus entrenamientos, incluso sin señal." />
    <!-- The notebook's paper: the browser chrome and the Android launch splash continue the page. -->
    <meta name="theme-color" content="#f3f2ee" />
    <!--
      The notebook is a light page and only a light page, so the browser is told not to restyle form
      controls and scrollbars for a dark theme the app will never wear.
    -->
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Chrome stopped honouring the apple- prefixed flag; the manifest is what installs the app, and
         this is the legacy hint some Android browsers still read. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GymTracker" />
    <!--
      Link previews. `og:image` is absolute because the app now has a production origin: crawlers
      resolve a relative URL against the page URL, but a preview is fetched by a crawler that may
      not be on that page's origin at all.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GymTracker" />
    <!-- The app writes Spanish and reads it: crawlers pick fonts and quotes from this. -->
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="GymTracker" />
    <meta property="og:description" content="Registrá tus entrenamientos, incluso sin señal." />
    <meta property="og:image" content="https://gymtracker-devkiings-projects.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="GymTracker: una hoja del cuaderno con la marca en tinta."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- iOS reads launch images from the document, one link per device box. Generated by scripts/generate-icons.mjs. -->
    <link
      rel="apple-touch-startup-image"
      href="/splash/splash-1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/splash-1179x2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/splash-1284x2778.png"
      media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/splash-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/splash-1125x2436.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/splash-1242x2688.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/splash-828x1792.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/splash-750x1334.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
